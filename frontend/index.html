<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SócBalena — Gestió d'immersions</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/print.css" media="print" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>" />
</head>
<body>

<!-- Pantalla de login (fora del shell) -->
<div id="login-screen" style="display:none"></div>

<!-- Shell principal de l'app -->
<div id="app-shell" style="display:none">
  <header id="topbar">
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <button class="btn btn-ghost btn-icon" id="btn-menu" aria-label="Obre el menú" title="Menú">☰</button>
      <a href="#/" class="logo">🐋 SócBalena <span>diari de busseig</span></a>
    </div>
    <div class="user-info" id="user-menu">
      <div class="user-avatar" id="user-avatar">?</div>
      <span id="user-nom">—</span>
      <button class="btn btn-ghost btn-sm" id="btn-logout">Sortir</button>
    </div>
  </header>

  <div id="sidebar-overlay" aria-hidden="true"></div>

  <nav id="sidebar">
    <span class="nav-section">Principal</span>
    <a class="nav-link" href="#/" data-route="/">
      <span class="icon">🏠</span> Inici
    </a>
    <a class="nav-link" href="#/immersions" data-route="/immersions">
      <span class="icon">🤿</span> Immersions
    </a>

    <span class="nav-section">Directori</span>
    <a class="nav-link" href="#/centres" data-route="/centres">
      <span class="icon">🏢</span> Centres
    </a>
    <a class="nav-link" href="#/zones" data-route="/zones">
      <span class="icon">🗺️</span> Zones
    </a>

    <span class="nav-section">Compte</span>
    <a class="nav-link" href="#/perfil" data-route="/perfil">
      <span class="icon">👤</span> Perfil
    </a>
  </nav>

  <main id="main-content"></main>
</div>

<!-- Scripts ES modules -->
<script type="module" src="/js/app.js"></script>
</body>
</html>
